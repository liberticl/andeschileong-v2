    <style>
    body {
  margin: 0;
  padding: 0;
  overflow: hidden;
}

#deck-container {
  width: 100vw;
  height: 100vh;
}

#deck-container canvas {
  z-index: 1;
  background: none;
}

#deck-container .error_text {
  color: red;
  background: none;
  position: absolute;
  z-index: 100;
}

  <style>
#panel{position:fixed;top:12px;left:12px;width:348px;max-height:calc(100vh - 24px);overflow-y:auto;background:rgba(255,255,255,.97);z-index:20;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.25);padding:14px 16px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13px;color:#222;line-height:1.45}
#panel h1{font-size:15px;margin:0 0 2px}#panel h2{font-size:12px;margin:12px 0 4px;color:#444}
#panel .sub{font-size:12px;color:#555;margin:0 0 8px}
#panel .tot{background:#f4f6f8;border-radius:6px;padding:7px 9px;font-size:12.5px;margin:8px 0}
#panel label{display:block;font-size:12.5px;margin:2px 0}
#panel .sw{display:inline-block;width:26px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
#panel .warn{font-size:11.5px;color:#6b4e00;background:#fff8e1;border-radius:6px;padding:7px 9px;margin:8px 0}
#panel .how,#panel .fix{font-size:12px;color:#333;background:#eef4fb;border-radius:6px;padding:7px 9px;margin:8px 0}
#panel .src{font-size:11px;color:#666}
#panel .body.collapsed{display:none}
#collapseBtn{float:right;border:1px solid #ccc;background:#fff;border-radius:6px;font-size:12px;cursor:pointer}
@media (max-width:640px){#panel{width:276px}}
</style>
<style>
#maptools{position:fixed;right:12px;bottom:12px;z-index:30;display:flex;flex-direction:column;gap:4px;
background:rgba(255,255,255,.95);border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.25);padding:5px;}
#maptools button{width:34px;height:34px;border:1px solid #ccc;background:#fff;border-radius:6px;
font-size:16px;line-height:1;cursor:pointer;color:#333;padding:0;}
#maptools button:hover{background:#eef5fc;border-color:#0072B2;}
#maptools button:disabled{opacity:.45;cursor:default;}
#maptools .tb-sep{height:1px;background:#ddd;margin:2px 3px;}
#maptools .tb-msg{position:fixed;right:54px;bottom:12px;max-width:280px;background:#333;color:#fff;
font:12px system-ui,sans-serif;padding:8px 12px;border-radius:6px;display:none;z-index:31;}
</style>
<style>
#panel{top:auto !important;bottom:64px !important;left:12px !important;max-height:44vh;display:none;}
#panel.open{display:block;}
#capasBtn{position:fixed;left:12px;bottom:12px;z-index:31;background:#fff;border:1px solid #ccc;
border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.25);padding:8px 14px;font:600 13px system-ui,sans-serif;
color:#222;cursor:pointer;}
#capasBtn:hover{background:#eef5fc;border-color:#0072B2;}
</style>

<label><input type="checkbox" id="cb-t1" checked> T1 Casablanca – Lo Vásquez</label>

<script>
(function(){
  function $(id){return document.getElementById(id);}
  var MAPA={"cb-t1":"corredor_T1","cb-t2":"corredor_T2","cb-t3a":"corredor_T3a","cb-t3b":"corredor_T3b","cb-t3c":"corredor_T3c","cb-t4":"corredor_T4","cb-com":"comunas_peak","cb-pts":"puntos"};
  function apply(){try{var layers=deckInstance.props.layers.map(function(l){for(var k in MAPA){if(l.id===MAPA[k])return l.clone({visible:$(k).checked});}return l;});deckInstance.setProps({layers:layers});}catch(e){console.error(e);}}
  Object.keys(MAPA).forEach(function(k){$(k).addEventListener("change",apply);});
})();
</script>
<div id="maptools" role="toolbar" aria-label="Controles del mapa">
<button data-tb="zin" title="Acercar (+)">+</button>
<button data-tb="zout" title="Alejar (−)">−</button>
<div class="tb-sep"></div>
<button data-tb="rotl" title="Rotar izquierda">⟲</button>
<button data-tb="rotr" title="Rotar derecha">⟳</button>
<button data-tb="pitch" title="Cambiar ángulo (0°/45°)">⛰</button>
<button data-tb="north" title="Norte arriba">N</button>
<div class="tb-sep"></div>
<button data-tb="fs" title="Pantalla completa">⛶</button>
<button data-tb="cap" title="Capturar mapa (PNG)">📷</button>
<div class="tb-msg" id="tb-msg"></div>
</div>
<script>
(function(){
  function msg(t, ms){
    try{
      var m = document.getElementById('tb-msg');
      m.textContent = t; m.style.display = 'block';
      setTimeout(function(){ m.style.display = 'none'; }, ms || 3500);
    }catch(e){}
  }
  function cur(){
    var d = {longitude: -71.53, latitude: -33.14, zoom: 9, pitch: 0, bearing: 0};
    try{
      var vs = (typeof deckInstance !== 'undefined') &&
        (deckInstance.viewState || deckInstance.props.initialViewState) || null;
      if (vs && typeof vs === 'object' && !('longitude' in vs)) {
        var ks = Object.keys(vs);
        for (var i = 0; i < ks.length; i++) {
          var v = vs[ks[i]];
          if (v && typeof v === 'object' && ('longitude' in v)) { vs = v; break; }
        }
      }
      if (vs && typeof vs === 'object' && ('longitude' in vs)) {
        if (isFinite(+vs.longitude)) d.longitude = +vs.longitude;
        if (isFinite(+vs.latitude)) d.latitude = +vs.latitude;
        if (vs.zoom != null && isFinite(+vs.zoom)) d.zoom = +vs.zoom;
        if (vs.pitch != null && isFinite(+vs.pitch)) d.pitch = +vs.pitch;
        if (vs.bearing != null && isFinite(+vs.bearing)) d.bearing = +vs.bearing;
      }
    }catch(e){}
    return d;
  }
  function go(patch){
    try{
      if (typeof deckInstance === 'undefined') return;
      var vs = cur();
      for (var k in patch) vs[k] = patch[k];
      if (vs.zoom < 0) vs.zoom = 0;
      if (vs.zoom > 20) vs.zoom = 20;
      if (vs.pitch < 0) vs.pitch = 0;
      if (vs.pitch > 60) vs.pitch = 60;
      deckInstance.setProps({initialViewState: vs});
    }catch(e){ console.error('maptools:', e); }
  }
  function toggleFS(){
    try{
      if (document.fullscreenElement) { document.exitFullscreen(); }
      else {
        var el = document.documentElement;
        var f = el.requestFullscreen || el.webkitRequestFullscreen;
        if (f) f.call(el); else msg('Pantalla completa no disponible aquí');
      }
    }catch(e){ console.error('maptools:', e); }
  }
  function capture(){
    try{
      if (typeof deckInstance === 'undefined') return;
      var done = false;
      deckInstance.setProps({onAfterRender: function(){
        if (done) return; done = true;
        try{
          var cv = deckInstance.canvas;
          if (!cv || !cv.toBlob) { msg('Captura no disponible en este navegador'); return; }
          cv.toBlob(function(blob){
            if (!blob) { msg('No se pudo capturar (lienzo vacío)'); return; }
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "mapa-ruta68.png";
            document.body.appendChild(a); a.click();
            setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
            msg('Captura descargada');
          }, 'image/png');
        }catch(err){ console.error('maptools:', err); msg('Captura bloqueada por el navegador'); }
      }});
      if (deckInstance.redraw) deckInstance.redraw(true);
    }catch(e){ console.error('maptools:', e); }
  }
  document.addEventListener('fullscreenchange', function(){
    var b = document.querySelector('#maptools [data-tb="fs"]');
    if (b) b.textContent = document.fullscreenElement ? '✕' : '⛶';
  });
  document.querySelectorAll('#maptools [data-tb]').forEach(function(b){
    b.addEventListener('click', function(){
      var a = b.getAttribute('data-tb'), v = cur();
      if (a === 'zin') go({zoom: v.zoom + 1});
      else if (a === 'zout') go({zoom: v.zoom - 1});
      else if (a === 'rotl') go({bearing: v.bearing - 15});
      else if (a === 'rotr') go({bearing: v.bearing + 15});
      else if (a === 'pitch') go({pitch: v.pitch > 20 ? 0 : 45});
      else if (a === 'north') go({bearing: 0, pitch: 0});
      else if (a === 'fs') toggleFS();
      else if (a === 'cap') capture();
    });
  });
})();
</script>

  b.id = 'capasBtn'; b.textContent = 'Capas ▾';
  b.setAttribute('aria-expanded', 'false');
  b.addEventListener('click', function(){
    var open = p.classList.toggle('open');
    b.textContent = open ? 'Capas ▴' : 'Capas ▾';
    b.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  document.body.appendChild(b);
})();
