// Build POI legend
(function() {
  var container = document.getElementById('poi-legend');
  var types = DATA.poiTypes;
  var sorted = Object.entries(types).sort(function(a, b) { return b[1] - a[1]; });
  var iconMap = {};
  var colorMap = {};
  DATA.pois.forEach(function(p) { iconMap[p.label] = p.icon; colorMap[p.label] = p.color; });
  sorted.forEach(function(entry) {
    var label = entry[0], count = entry[1];
    var icon = iconMap[label] || 'fa-location-dot';
    var color = colorMap[label] || '#95a5a6';
    var div = document.createElement('div');
    div.style.cssText = 'display:flex;align-items:center;gap:4px;margin:2px 0;font-size:10px;';
    div.innerHTML = '<i class="fa-solid ' + icon + '" style="width:14px;text-align:center;color:' + color + ';font-size:10px;"></i> ' + label + ' <span style="color:#888;">(' + count + ')</span>';
    container.appendChild(div);
  });
})();

var layerVisibility = { arcs: true, ciclovias: true, pois: true };
var tooltipEl = null;

function showTooltipArc(info) {
  if (!tooltipEl) tooltipEl = document.getElementById('tooltip');
  if (info && info.object) {
    tooltipEl.style.display = 'block';
    tooltipEl.style.left = info.x + 10 + 'px';
    tooltipEl.style.top = info.y + 10 + 'px';
    tooltipEl.innerHTML = info.object.name + ' · ' + info.object.fecha;
  } else {
    tooltipEl.style.display = 'none';
  }
}

function showTooltipCiclo(info) {
  if (!tooltipEl) tooltipEl = document.getElementById('tooltip');
  if (info && info.object) {
    tooltipEl.style.display = 'block';
    tooltipEl.style.left = info.x + 10 + 'px';
    tooltipEl.style.top = info.y + 10 + 'px';
    tooltipEl.innerHTML = 'Ciclovía: ' + info.object.name;
  } else {
    tooltipEl.style.display = 'none';
  }
}

function showTooltipPoi(info) {
  if (!tooltipEl) tooltipEl = document.getElementById('tooltip');
  if (info && info.object) {
    tooltipEl.style.display = 'block';
    tooltipEl.style.left = info.x + 10 + 'px';
    tooltipEl.style.top = info.y + 10 + 'px';
    tooltipEl.innerHTML = info.object.name + ' (' + info.object.label + ')';
  } else {
    tooltipEl.style.display = 'none';
  }
}

function buildLayers() {
  var layers = [];

  if (layerVisibility.arcs) {
    // Origin dots (clustered)
    layers.push(new deck.ScatterplotLayer({
      id: 'origins',
      data: DATA.origins,
      getPosition: d => d.position,
      getRadius: 5,
      radiusMinPixels: 2,
      getFillColor: [76, 175, 80, 200],
      getLineColor: [255, 255, 255, 255],
      lineWidthMinPixels: 1,
      pickable: true,
      onHover: function(info) {
        if (!tooltipEl) tooltipEl = document.getElementById('tooltip');
        if (info && info.object) {
          tooltipEl.style.display = 'block';
          tooltipEl.style.left = info.x + 10 + 'px';
          tooltipEl.style.top = info.y + 10 + 'px';
          tooltipEl.innerHTML = info.object.count + ' viaje' + (info.object.count > 1 ? 's' : '') + ' (origen)';
        } else {
          tooltipEl.style.display = 'none';
        }
      },
    }));
    // Destination dots (clustered)
    layers.push(new deck.ScatterplotLayer({
      id: 'destinations',
      data: DATA.destinations,
      getPosition: d => d.position,
      getRadius: 5,
      radiusMinPixels: 2,
      getFillColor: [244, 67, 54, 200],
      getLineColor: [255, 255, 255, 255],
      lineWidthMinPixels: 1,
      pickable: true,
      onHover: function(info) {
        if (!tooltipEl) tooltipEl = document.getElementById('tooltip');
        if (info && info.object) {
          tooltipEl.style.display = 'block';
          tooltipEl.style.left = info.x + 10 + 'px';
          tooltipEl.style.top = info.y + 10 + 'px';
          tooltipEl.innerHTML = info.object.count + ' viaje' + (info.object.count > 1 ? 's' : '') + ' (destino)';
        } else {
          tooltipEl.style.display = 'none';
        }
      },
    }));
    // Arcs
    layers.push(new deck.ArcLayer({
      id: 'arcs',
      data: DATA.arcs,
      getSourcePosition: d => d.sourcePosition,
      getTargetPosition: d => d.targetPosition,
      getSourceColor: [76, 175, 80, 160],
      getTargetColor: [244, 67, 54, 160],
      getWidth: 1.5,
      widthMinPixels: 1,
      pickable: true,
      onHover: showTooltipArc,
    }));
  }

  if (layerVisibility.ciclovias) {
    layers.push(new deck.PathLayer({
      id: 'ciclovias',
      data: DATA.ciclovias,
      getPath: d => d.path,
      getColor: [80, 139, 226, 200],
      getWidth: 3,
      widthMinPixels: 3,
      pickable: true,
      onHover: showTooltipCiclo,
      getDashArray: d => [12, 8],
      extensions: [new deck.PathStyleExtension({ dash: true })],
    }));
  }

  if (layerVisibility.pois) {
    layers.push(new deck.ScatterplotLayer({
      id: 'pois',
      data: DATA.pois,
      getPosition: d => d.position,
      getRadius: 15,
      radiusMinPixels: 4,
      getFillColor: d => d.fillColor,
      getLineColor: [255, 255, 255, 255],
      lineWidthMinPixels: 1,
      pickable: true,
      onHover: showTooltipPoi,
    }));
  }

  return layers;
}

function toggleLayer(name) {
  layerVisibility[name] = document.getElementById('toggle-' + name).checked;
  overlay.setProps({ layers: buildLayers() });
}

var map = new maplibregl.Map({
  container: 'map',
  style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
  center: [-62.2663, -38.7219],
  zoom: 11,
  pitch: 45,
  bearing: -30
});

map.addControl(new maplibregl.NavigationControl());
map.addControl(new maplibregl.FullscreenControl({ container: document.getElementById('map-container') }));

var overlay;

map.on('load', function() {
  overlay = new deck.MapboxOverlay({
    layers: buildLayers(),
    interleaved: true
  });
  map.addControl(overlay);
});
</script>
